<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190">
<style>
.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.blink{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
.pulse{animation:p 1.6s ease-in-out infinite}@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
.type{animation:t 2.2s steps(14) .3s both}@keyframes t{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.fade{animation:f .8s ease 2.4s both}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
</style>
<rect width="1000" height="190" rx="10" fill="#0b0e14"/>
<rect width="1000" height="30" rx="10" fill="#151b26"/><rect y="20" width="1000" height="10" fill="#151b26"/>
<circle cx="20" cy="15" r="5" fill="#ff5f57"/><circle cx="38" cy="15" r="5" fill="#febc2e"/><circle cx="56" cy="15" r="5" fill="#28c840"/>
<text x="500" y="20" text-anchor="middle" class="mono" font-size="12" fill="#6b7a90">neel@terminal — ~/portfolio — 120×40</text>
<circle cx="900" cy="15" r="4" fill="#00d27a" class="pulse"/><text x="910" y="19" class="mono" font-size="11" fill="#00d27a">MKT OPEN</text>
<text x="40" y="62" class="mono" font-size="14" fill="#6b7a90">$ ./whoami --profile</text>
<g class="type"><text x="40" y="110" class="mono" font-size="44" font-weight="700" fill="#ffb000">NEEL KACHHADIA</text></g>
<rect x="444" y="78" width="22" height="38" fill="#ffb000" class="blink"/>
<g class="fade">
<text x="40" y="142" class="mono" font-size="15" fill="#c9d4e3">SYSTEMS ENGINEER  <tspan fill="#36bcf7">▸</tspan>  AI × FINANCE × LOW-LATENCY INFRA</text>
<text x="40" y="168" class="mono" font-size="13" fill="#6b7a90">TICKER <tspan fill="#00d27a">NEEL.K</tspan>   SECTOR <tspan fill="#c9d4e3">C++ · Rust · Python · TS</tspan>   RATING <tspan fill="#00d27a">STRONG BUILD ▲</tspan></text>
</g>
</svg>
